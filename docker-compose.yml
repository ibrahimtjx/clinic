name: clinic

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # holds the internal CA; backed up nightly by ops
      - caddy_config:/config
      - desktop_updates:/srv/desktop # desktop installer and update files (docs/desktop.md)
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  api:
    build: ./api
    restart: unless-stopped
    environment:
      CLINIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-clinic}
      # Signs access tokens. Must be the same on the primary and the standby (SPEC 15).
      CLINIC_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLINIC_FILES_DIR: /data/files
      TZ: Asia/Riyadh
    volumes:
      - patient_files:/data/files # images and documents (SPEC 8.5); backed up by ops
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Replication, WAL archiving and access rules: ops/db/start.sh (SPEC 15.2).
    entrypoint: ["/bin/sh", "/clinic/start.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      PEER_IP: ${PEER_IP:-}
      PEER_HBA: ${PEER_HBA:-}
      TZ: Asia/Riyadh
      PGTZ: Asia/Riyadh
    # Clients never reach the database (SPEC 2 Rules). The port is published on this host only, or on
    # this server's LAN address (DB_PUBLISH_IP) for the other server, which alone may log in.
    ports:
      - "${DB_PUBLISH_IP:-127.0.0.1}:${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - wal_staging:/wal-staging
      - ./ops/db:/clinic:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backups, WAL shipping and the health heartbeat: ops/bin/run.sh (SPEC 15.2, 15.4). Runs on both
  # servers; on the standby it only reports its health to the primary.
  ops:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/ops/run.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      NODE_NAME: ${NODE_NAME:-server-1}
      PEER_IP: ${PEER_IP:-}
      PEER_DB_PORT: ${PEER_DB_PORT:-5432}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
      BACKUP_TIME: ${BACKUP_TIME:-0200}
      OPS_INTERVAL: ${OPS_INTERVAL:-60}
      TZ: Asia/Riyadh
    volumes:
      - ./ops/bin:/ops:ro
      - wal_staging:/wal-staging
      - ${BACKUP_DIR:-./backups}:/backup
      - ${BACKUP_KEY_FILE:-/dev/null}:/run/secrets/backup_key:ro
      - caddy_data:/caddy:ro
      - patient_files:/files:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  desktop_updates:
  wal_staging: # WAL waiting to be encrypted onto the backup drive
  patient_files: # images and documents uploaded to patients
